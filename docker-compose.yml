services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      LIVEKIT_URL: ${LIVEKIT_URL:?}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-heyvera}
      SESSION_SECRET: ${SESSION_SECRET:?}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-flux-general-multi}
      DEEPGRAM_EOT_THRESHOLD: ${DEEPGRAM_EOT_THRESHOLD:-0.75}
      DEEPGRAM_EOT_TIMEOUT_MS: ${DEEPGRAM_EOT_TIMEOUT_MS:-5000}
      DEEPGRAM_TTS_MODEL: ${DEEPGRAM_TTS_MODEL:-aura-2-viktoria-de}
      DEEPGRAM_TTS_FALLBACK_MODEL: ${DEEPGRAM_TTS_FALLBACK_MODEL:-aura-2-elara-de}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      MAX_SESSION_MS: ${MAX_SESSION_MS:-600000}
      IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS:-60000}
      MAX_TURNS: ${MAX_TURNS:-40}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-60000}
      INTERRUPTION_MIN_DURATION_MS: ${INTERRUPTION_MIN_DURATION_MS:-400}
      INTERRUPTION_MIN_WORDS: ${INTERRUPTION_MIN_WORDS:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-heyvera}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-heyvera}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    environment:
      NODE_ENV: production
      LIVEKIT_URL: ${LIVEKIT_URL:?}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-heyvera}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-flux-general-multi}
      DEEPGRAM_EOT_THRESHOLD: ${DEEPGRAM_EOT_THRESHOLD:-0.75}
      DEEPGRAM_EOT_TIMEOUT_MS: ${DEEPGRAM_EOT_TIMEOUT_MS:-5000}
      DEEPGRAM_TTS_MODEL: ${DEEPGRAM_TTS_MODEL:-aura-2-viktoria-de}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      MAX_SESSION_MS: ${MAX_SESSION_MS:-600000}
      IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS:-60000}
      MAX_TURNS: ${MAX_TURNS:-40}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-60000}
      INTERRUPTION_MIN_DURATION_MS: ${INTERRUPTION_MIN_DURATION_MS:-400}
      INTERRUPTION_MIN_WORDS: ${INTERRUPTION_MIN_WORDS:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-heyvera}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-heyvera}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 11m
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    command: ["./packages/db/node_modules/.bin/tsx", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heyvera}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-heyvera}
    depends_on:
      postgres:
        condition: service_healthy
    exclude_from_hc: true
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heyvera}
      POSTGRES_USER: ${POSTGRES_USER:-heyvera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heyvera} -d ${POSTGRES_DB:-heyvera}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
